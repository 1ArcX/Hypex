[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 3000
  autoLaunch = false

[functions]
  directory = "netlify/functions"

# Geplande taken (pomodoro-cron, rain-check, calendar-sync, focus-reminders) worden aangeroepen door
# Supabase pg_cron (supabase/migrations/add_cron_scheduler.sql) i.p.v. Netlify-schema's: die telden
# elke run mee voor de function-limiet, ook als er niets te doen was.

[functions."magister/magister"]
  timeout = 26

[[headers]]
  for = "/simacan-arrival.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/simacan-arrival.html"
  to = "/simacan-arrival.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200