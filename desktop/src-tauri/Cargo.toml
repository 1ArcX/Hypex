[package]
name = "hypex-desktop"
version = "1.0.0"
description = "Hypex desktop app: laadt de live Netlify-site in een eigen venster."
authors = ["ArcX"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hypex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
